name: verbs

on:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [main]
    paths: [src/agentic_sdlc/command.py, scripts/check_verb_tables.py]
  pull_request:
    paths: [src/agentic_sdlc/command.py, scripts/check_verb_tables.py]

permissions:
  contents: read

jobs:
  verb-tables:
    name: gh/glab verb tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: gh --version
      - name: Install glab (not preinstalled on the runner)
        run: brew install glab
      - run: uv run python scripts/check_verb_tables.py
