name: verbs

on:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [main]
    paths: [src/agentic_sdlc/command.py, scripts/check_verb_tables.py]
  pull_request:
    paths: [src/agentic_sdlc/command.py, scripts/check_verb_tables.py]

permissions:
  contents: read

jobs:
  verb-tables:
    name: gh/glab verb tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: gh --version
      - name: Install glab (not preinstalled on the runner)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install glab
      - run: uv run python scripts/check_verb_tables.py
