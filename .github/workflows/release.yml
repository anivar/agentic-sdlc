# Creates the GitHub release for a version tag from that version's CHANGELOG section, then
# publishes the distribution to PyPI with trusted publishing (OIDC; no API token is ever
# created). Runs only when the tag is created: a moved tag (`git push --force` of an existing
# tag) does not run it again, so a release and its notes are written once.
#
# One-time maintainer setup, before the first tag that should publish: on PyPI create a
# pending trusted publisher for the project agentic-sdlc naming this repository
# (anivar/agentic-sdlc), this workflow (release.yml) and the environment pypi, and create the
# pypi environment here. From then on a signed v* tag is the whole release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    if: ${{ github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the CHANGELOG section for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## /       { inside = ($2 == v) ; next }
            inside && /^## / { exit }
            inside       { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed '## $version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "agentic-sdlc ${{ steps.notes.outputs.version }}" --notes-file notes.md --verify-tag

  pypi:
    name: pypi
    if: ${{ github.event.created }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv build
      - run: uv publish --trusted-publishing always
